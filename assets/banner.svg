<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b2b"/>
      <stop offset="1" stop-color="#1a1250"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05040f" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#05040f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#base)"/>
  <g filter="url(#blur)">
    <ellipse cx="860" cy="120" rx="260" ry="120" fill="#7c3aed" opacity="0.85"/>
    <ellipse cx="1060" cy="260" rx="220" ry="110" fill="#06b6d4" opacity="0.7"/>
    <ellipse cx="620" cy="320" rx="240" ry="90" fill="#ec4899" opacity="0.55"/>
    <ellipse cx="300" cy="60" rx="200" ry="80" fill="#4f46e5" opacity="0.5"/>
  </g>
  <g stroke="url(#fade)" stroke-width="1.2">
    <line x1="600" y1="220" x2="-200" y2="400"/>
    <line x1="600" y1="220" x2="100" y2="400"/>
    <line x1="600" y1="220" x2="400" y2="400"/>
    <line x1="600" y1="220" x2="700" y2="400"/>
    <line x1="600" y1="220" x2="1000" y2="400"/>
    <line x1="600" y1="220" x2="1300" y2="400"/>
    <line x1="600" y1="220" x2="1600" y2="400"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="0" y1="335" x2="1200" y2="335"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
  </g>
  <g fill="#ffffff">
    <circle cx="980" cy="70" r="1.6" opacity="0.8"/>
    <circle cx="1110" cy="120" r="1.2" opacity="0.6"/>
    <circle cx="760" cy="48" r="1.4" opacity="0.7"/>
    <circle cx="880" cy="190" r="1" opacity="0.5"/>
    <circle cx="1040" cy="30" r="1.1" opacity="0.6"/>
    <circle cx="680" cy="140" r="1.3" opacity="0.5"/>
  </g>
  <rect width="1200" height="400" fill="url(#shade)"/>
</svg>
